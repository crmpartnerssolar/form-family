<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f3f1e8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<title>Como está o seu sono?</title>
<style>
/* Layout: coluna única mobile, uma pergunta por tela, abas no topo (não sobem com o teclado) */
:root{
  --bg:#f3f1e8; --card:#fdfcf7; --fg:#2c3a2e; --muted:#6f7b6c; --line:#e1dfd0; --accent:#5b8a5f; --accent-fg:#fdfcf7;
  --a:#6fa6bf; --b:#dfa94f; --c:#7b9a5a; --ok:#5b8a5f;
  --radius:20px;
  --serif:"Fraunces",Georgia,"Times New Roman",serif; --sans:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(120% 60% at 100% 0%,#dfe9d3 0%,transparent 60%),radial-gradient(90% 50% at 0% 100%,#f3e3c6 0%,transparent 60%),var(--bg);background-attachment:fixed;color:var(--fg);font:16px/1.5 var(--sans);min-height:100dvh;overscroll-behavior-y:none}
h1,h2{font-family:var(--serif);font-weight:600}
button{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding:max(10px,env(safe-area-inset-top)) 0 10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tab{border:0;background:none;padding:12px 8px;border-radius:10px;font-weight:600;color:var(--muted);min-height:44px}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-fg)}
.tab small{font-weight:600;opacity:.85}
main{flex:1;display:flex;flex-direction:column;padding-bottom:max(20px,env(safe-area-inset-bottom))}
h1{font-size:1.7rem;line-height:1.15;margin:8px 0 8px;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:1.2rem;line-height:1.25;margin:0 0 14px;text-wrap:balance}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.field{display:flex;flex-direction:column;gap:6px;margin:18px 0}
label{font-weight:600}
input[type=text]{font-size:16px;width:100%;padding:15px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);min-height:52px;scroll-margin-top:90px;scroll-margin-bottom:120px}
input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:1.05rem;cursor:pointer}
.btn[disabled]{opacity:.45}
.btn.ghost{background:none;color:var(--muted);border:1.5px solid var(--line);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.step{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted)}
.back{border:0;background:none;color:var(--muted);padding:10px 6px 10px 0;min-height:44px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:15px 14px;min-height:60px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;cursor:pointer;line-height:1.35}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem;background:var(--line);color:var(--fg)}
.opt[aria-checked=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.opt[aria-checked=true] .k{background:var(--accent);color:var(--accent-fg)}
.dock{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:10px}
.err{color:#d6453d;font-weight:600;font-size:.95rem;min-height:1.2em}
/* resultados */
.sec{margin:6px 0 22px}
.sec>h2{margin-bottom:10px}
.row{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:700;overflow-wrap:anywhere}
.you{font-size:.72rem;font-weight:700;background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;background:var(--line)}
.stack>span{display:grid;place-items:center;color:#fff;font-size:.75rem;font-weight:800;min-width:0;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.stack{border-radius:99px}
.opt{border-radius:18px}.opt .k{font-family:var(--serif)}
.btn{border-radius:99px;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.tabs{border-radius:99px}.tab{border-radius:99px}
.leaf{display:block;width:44px;height:44px;margin:14px 0 0;color:var(--accent)}
.sa{background:var(--a)}.sb{background:var(--b)}.sc{background:var(--c)}
.chip{font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:99px;color:#fff;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--muted);margin-bottom:6px}
.legend b{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}
.scroll{overflow-x:auto;max-width:100%;border-radius:12px;border:1px solid var(--line);background:var(--card);-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;font-size:.85rem}
th,td{padding:0;text-align:center}
th{font-weight:700;color:var(--muted);padding:8px 0;min-width:32px}
td.m{width:32px;height:34px}
td.m span{display:grid;place-items:center;width:26px;height:26px;margin:3px;border-radius:7px;color:#fff;font-weight:800;font-size:.8rem}
.sticky{position:sticky;left:0;background:var(--card);text-align:left;padding:0 10px;min-width:92px;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;z-index:1;border-right:1px solid var(--line)}
td.m span.eq{outline:2px solid var(--ok);outline-offset:1px}
details{border-top:1px solid var(--line)}
details:first-of-type{border-top:0}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;min-height:52px;cursor:pointer;font-weight:700}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";color:var(--muted);transition:transform .2s}
details[open] summary::after{transform:rotate(180deg)}
.qa{padding:0 0 14px;display:flex;flex-direction:column;gap:10px}
.qa p{margin:0;font-size:.92rem}
.qa .q{color:var(--muted);font-size:.84rem}
.qa .ans{display:flex;gap:8px;align-items:flex-start}
.qa .ans i{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800;font-size:.78rem}
.bk{display:flex;justify-content:space-between;align-items:center}
.refresh{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;min-height:40px;font-weight:600;color:var(--muted)}
.done{text-align:center;padding:28px 16px}
.done .big{font-size:2.4rem}
.fade{animation:f .2s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar>i{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-q" role="tab" aria-selected="true">Responder</button>
      <button class="tab" id="tab-r" role="tab" aria-selected="false">Respostas <small id="cnt"></small></button>
    </div>
  </header>
  <main id="main"></main>
</div>
<script>
const SB_URL="https://rbpetvhucsbkzhkmsmlt.supabase.co/rest/v1/sono_respostas";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJicGV0dmh1Y3Nia3poa21zbWx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NTIwNzUsImV4cCI6MjA5MTQyODA3NX0.t6MvV_fCm2DitIstXlCHUzntJeAjfeLtFWfiEuINyeQ";
const H={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"};
const TIPO={a:"Sono leve",b:"Sono variável",c:"Sono pesado"};
const COR={a:"var(--a)",b:"var(--b)",c:"var(--c)"};
const Q=[
["Meu tipo físico natural seria considerado:","Magro ou miúdo.","Forte ou alto.","Robusto, seja qual for a altura."],
["Quando me queixo da temperatura do quarto, geralmente reclamo que:","Estou com frio, ou com as mãos e os pés frios.","Está quente demais. Estou suando.","Está abafado ou úmido demais."],
["Quando tenho insônia, geralmente é porque:","Passo muito tempo tentando relaxar o suficiente para adormecer.","Acordo antes da hora e não consigo voltar a dormir.","Sinto desconforto físico ao me deitar ou durante a noite."],
["Em termos físicos, sei que terei dificuldade para dormir se:","Estiver com frio. Mesmo sob as cobertas, não consigo me aquecer.","O quarto estiver quente demais ou eu acordar suando.","Não conseguir encontrar uma posição confortável."],
["Em termos emocionais, sei que terei dificuldade para dormir se:","Meus pensamentos estiverem fervilhando de medo ou empolgação, ou se eu ficar repassando uma conversa que não foi boa.","Eu tiver um prazo urgente ou me sentir sobrecarregado de trabalho. Tenho coisas em excesso para fazer.","Eu estiver preocupado com a saúde ou com alguém próximo que passa por dificuldades."],
["Quando tento uma dieta nova, sei que acordarei no meio da noite por estar com muita fome.","Não.","Sim.","Às vezes."],
["Na primeira hora depois de acordar, eu me sinto:","Desperto, mas ainda me recomponho. Preciso de café ou da rotina para conseguir me concentrar.","Completamente desperto. Confiro os e-mails antes de pôr os pés no chão.","As manhãs são difíceis. Gosto de começar o dia lentamente."],
["Nas noites em que fico acordado até mais tarde do que deveria, em geral é porque:","Tenho novo ânimo depois das 22h e me empolgo para encarar um filme ou um projeto.","Embora esteja cansado, tento resolver mais coisas da minha lista de tarefas, ou não consigo largar um projeto urgente.","Estou num programa com os amigos e não consigo escapar."],
["Meu(minha) parceiro(a) diz que o(a) mantenho acordado(a) porque:","Fico me virando.","Jogo as cobertas longe.","Ronco."],
["Quando o desconforto físico me mantém acordado, geralmente é porque:","Estou dolorido ou minhas pernas estão inquietas e ativas.","Tenho azia.","Não consigo ajeitar os travesseiros para dar conforto ao pescoço."],
["Quando não tenho uma boa noite de sono, meu maior problema no dia seguinte é me sentir:","Distraído e exausto, incapaz de funcionar direito.","Irritável por ter pouca energia. Não estou no melhor de mim.","Grogue ou congestionado a princípio, mas consigo melhorar no meio da manhã."],
["Quando acordo no meio da noite, geralmente é porque:","Qualquer ruído, sonho ou mudança de luz me acorda.","Estou com um problema sério que não me deixa em paz.","Não sei o que me acorda."],
["Quando acordo uma ou duas horas antes do horário ideal, eu:","Tento voltar a dormir, porque descansar é importante para mim.","Começo a pensar em tudo o que tenho para fazer.","Fico alegre, porque posso dormir mais."],
["Minha disposição natural poderia ser descrita como:","Gregária, inquisitiva ou ansiosa.","Motivada, determinada ou ativa.","Tranquila, serena ou generosa."],
["Embora seja um pouco injusta, a queixa que sempre ouço das pessoas queridas é que:","Tento fazer coisas demais ou não termino o que começo.","Sou um pouco autoritário ou defensivo.","Não consigo tomar decisões, ou acabo cedendo para deixar os outros felizes."],
["Em termos das estações, meus padrões de sono e humor mudam no inverno porque:","O ar fica tão seco que me sinto inquieto e desconfortável.","É mais fácil dormir quando a casa está mais fresca.","É dificílimo me levantar quando o céu ainda está escuro."],
["Meus padrões de sono e humor mudam no verão porque:","Eu me sinto mais feliz e durmo melhor quando há mais luz natural.","Amo a luz do sol, mas os dias quentes me deixam frustrado, irritado e incapaz de dormir.","Adoro o verão, mas às vezes tenho problemas com alergias sazonais. Os dias úmidos são terríveis."],
["Quando sonho, costumo sonhar com:","Alguém me perseguindo ou algum tipo de desastre.","Sonhos relacionados a ações, planos ou reprises do que aconteceu durante o dia.","Grandes volumes de água."]
];
const KEYS=["a","b","c"];
const $=s=>document.querySelector(s);
const main=$("#main");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let tab="q", nome=store.get("sono_nome")||"", resp=store.get("sono_resp")||[], idx=store.get("sono_idx")||0, myId=store.get("sono_myid"), rows=null, erro="", enviando=false, timer=null;
if(idx>Q.length)idx=0;

function setTab(t){
  tab=t;
  $("#tab-q").setAttribute("aria-selected",t==="q");$("#tab-r").setAttribute("aria-selected",t==="r");
  clearInterval(timer);
  if(t==="r"){load();timer=setInterval(load,15000)}
  render();window.scrollTo(0,0);
}
$("#tab-q").onclick=()=>setTab("q");$("#tab-r").onclick=()=>setTab("r");

function render(){tab==="q"?renderForm():renderResults()}

function renderForm(){
  if(myId&&idx>=Q.length){
    main.innerHTML=`<div class="card done fade"><div class="big">🌿</div><h2>Respostas enviadas</h2><p class="muted">Obrigado, ${esc(nome)}. Veja o comparativo com o pessoal.</p><button class="btn" id="go">Ver respostas</button></div>`;
    $("#go").onclick=()=>setTab("r");return;
  }
  if(idx===0&&!nome){
    main.innerHTML=`<div class="fade"><svg class="leaf" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 38C8 20 20 8 40 8c0 20-12 32-30 30z"/><path d="M10 38c6-10 13-17 22-22"/></svg><h1>Como está o seu sono?</h1><p class="muted">18 perguntas de tocar, uns 2 minutos. Não existe resposta certa: escolha a que mais combina com a sua rotina.</p>
    <div class="field"><label for="nome">Seu nome</label><input id="nome" type="text" autocomplete="given-name" autocapitalize="words" enterkeyhint="go" maxlength="40" placeholder="Como te chamam?"></div>
    <p class="err" id="err"></p>
    <div class="dock"><button class="btn" id="ini">Começar</button></div></div>`;
    const i=$("#nome"),go=()=>{const v=i.value.trim();if(!v){$("#err").textContent="Digite seu nome para começar.";i.focus();return}nome=v;store.set("sono_nome",v);idx=0;resp=[];save();renderQ()};
    $("#ini").onclick=go;i.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();i.blur();go()}};
    i.onfocus=()=>setTimeout(()=>i.scrollIntoView({block:"center",behavior:"smooth"}),300);
    return;
  }
  if(idx>=Q.length)return renderConfirm();
  renderQ();
}
function save(){store.set("sono_resp",resp);store.set("sono_idx",idx)}

function renderQ(){
  if(idx>=Q.length)return renderConfirm();
  const q=Q[idx],pct=Math.round(idx/Q.length*100);
  main.innerHTML=`<div class="fade" id="qv">
   <div class="step"><button class="back" id="bk" ${idx===0?"disabled style=\"opacity:.3\"":""}>← Voltar</button><span>${idx+1} de ${Q.length}</span></div>
   <div class="bar"><i style="width:${pct}%"></i></div>
   <h2 style="margin-top:16px">${esc(q[0])}</h2>
   <div class="opts" role="radiogroup">${KEYS.map((k,n)=>`<button class="opt" role="radio" aria-checked="${resp[idx]===k}" data-k="${k}"><span class="k">${k.toUpperCase()}</span><span>${esc(q[n+1])}</span></button>`).join("")}</div></div>`;
  $("#bk").onclick=()=>{if(idx>0){idx--;save();renderQ();window.scrollTo(0,0)}};
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    resp[idx]=b.dataset.k;main.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-checked",x===b));
    setTimeout(()=>{idx++;save();renderQ();window.scrollTo(0,0)},220);
  });
}

function renderConfirm(){
  main.innerHTML=`<div class="fade"><h1>Tudo pronto, ${esc(nome)}</h1><p class="muted">Você respondeu as 18 perguntas. Ao enviar, suas respostas aparecem na aba Respostas para o grupo.</p>
  <p class="err" id="err">${esc(erro)}</p>
  <div class="dock"><button class="btn" id="env" ${enviando?"disabled":""}>${enviando?"Enviando…":"Enviar respostas"}</button><button class="btn ghost" id="rev">Revisar a última</button></div></div>`;
  $("#rev").onclick=()=>{idx=Q.length-1;save();renderQ()};
  $("#env").onclick=enviar;
}
async function enviar(){
  if(enviando)return;enviando=true;erro="";renderConfirm();
  const o={};resp.forEach((k,i)=>o["q"+(i+1)]=k);
  try{
    const r=await fetch(SB_URL,{method:"POST",headers:{...H,Prefer:"return=representation"},body:JSON.stringify({nome,respostas:o})});
    if(!r.ok)throw new Error(r.status);
    const [row]=await r.json();myId=row.id;store.set("sono_myid",myId);enviando=false;
    setTab("r");
  }catch{enviando=false;erro="Não deu para enviar. Confira a internet e toque de novo, suas respostas estão guardadas.";renderConfirm()}
}

async function load(){
  try{
    const r=await fetch(SB_URL+"?select=id,nome,respostas,created_at&order=created_at.asc&limit=200",{headers:H});
    if(!r.ok)throw 0;rows=await r.json();
  }catch{if(!rows)rows=[];}
  $("#cnt").textContent=rows.length?`(${rows.length})`:"";
  if(tab==="r")renderResults();
}
function contar(r){const c={a:0,b:0,c:0};for(let i=1;i<=Q.length;i++){const k=r.respostas["q"+i];if(c[k]!==undefined)c[k]++}return c}
function veredito(c){const m=Math.max(c.a,c.b,c.c);const top=KEYS.filter(k=>c[k]===m);return top.length>1?{t:"Sono misto",cor:"var(--muted)",ks:top}:{t:TIPO[top[0]],cor:COR[top[0]],ks:top}}
function stack(c){const t=Q.length;return `<div class="stack">${KEYS.map(k=>c[k]?`<span class="s${k}" style="width:${c[k]/t*100}%">${c[k]}</span>`:"").join("")}</div>`}

function renderResults(){
  if(rows===null){main.innerHTML=`<p class="muted">Carregando…</p>`;return}
  if(!rows.length){main.innerHTML=`<div class="card done fade"><div class="big">🌱</div><h2>Ninguém respondeu ainda</h2><p class="muted">Quando o primeiro enviar, os gráficos aparecem aqui.</p><button class="btn" id="go">Responder agora</button></div>`;$("#go").onclick=()=>setTab("q");return}
  const open=new Set([...main.querySelectorAll("details[open]")].map(d=>d.dataset.id));
  const cs=rows.map(contar);const tot={a:0,b:0,c:0};cs.forEach(c=>KEYS.forEach(k=>tot[k]+=c[k]));
  const n=rows.length;
  const you=r=>r.id===myId?`<span class="you">você</span>`:"";
  let h=`<div class="fade"><div class="bk"><h1 style="margin:4px 0">Comparativo</h1><button class="refresh" id="rf">Atualizar</button></div>
  <div class="legend"><span><b class="sa"></b>A leve</span><span><b class="sb"></b>B variável</span><span><b class="sc"></b>C pesado</span></div>
  <div class="sec card">`;
  h+=rows.map((r,i)=>{const v=veredito(cs[i]);return `<div class="row"><div class="top"><span class="name">${esc(r.nome)}${you(r)}</span><span class="chip" style="background:${v.cor}">${v.t}</span></div>${stack(cs[i])}</div>`}).join("");
  const gv=veredito(tot);
  h+=`<div class="row"><div class="top"><span class="name">Média do grupo</span><span class="chip" style="background:${gv.cor}">${gv.t}</span></div>${stack({a:+(tot.a/n).toFixed(1),b:+(tot.b/n).toFixed(1),c:+(tot.c/n).toFixed(1)})}</div></div>`;
  // matriz por pergunta
  h+=`<div class="sec"><h2>Pergunta por pergunta</h2><p class="muted" style="margin:-6px 0 10px;font-size:.9rem">Contorno verde: todo mundo respondeu igual. Deslize para o lado.</p><div class="scroll"><table><thead><tr><th class="sticky"></th>${Q.map((_,i)=>`<th>${i+1}</th>`).join("")}</tr></thead><tbody>`;
  const eq=Q.map((_,i)=>n>1&&rows.every(r=>r.respostas["q"+(i+1)]===rows[0].respostas["q"+(i+1)]));
  h+=rows.map(r=>`<tr><td class="sticky">${esc(r.nome)}</td>${Q.map((_,i)=>{const k=r.respostas["q"+(i+1)];return `<td class="m"><span class="${eq[i]?"eq":""}" style="background:${COR[k]||"var(--line)"}">${k?k.toUpperCase():"-"}</span></td>`}).join("")}</tr>`).join("");
  h+=`</tbody></table></div></div>`;
  // respostas completas
  h+=`<div class="sec card"><h2>Respostas de cada um</h2>`;
  h+=rows.map((r,i)=>`<details data-id="${esc(r.id)}" ${open.has(r.id)?"open":""}><summary><span>${esc(r.nome)}${you(r)}</span></summary><div class="qa">${Q.map((q,j)=>{const k=r.respostas["q"+(j+1)];const ix=KEYS.indexOf(k);return `<div><p class="q">${j+1}. ${esc(q[0])}</p><div class="ans"><i style="background:${COR[k]||"var(--line)"}">${k?k.toUpperCase():"-"}</i><p>${ix>=0?esc(q[ix+1]):"Sem resposta"}</p></div></div>`}).join("")}</div></details>`).join("");
  h+=`</div></div>`;
  main.innerHTML=h;
  $("#rf").onclick=load;
}

load();render();
</script>
</body>
</html>
